<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Volleyball Serve Physics{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{{ url_for('index') }}" class="logo">Volleyball Serve Physics</a>
      <nav class="nav">
        <a href="{{ url_for('index') }}" class="nav-link{% if request.endpoint == 'index' %} active{% endif %}">Intro</a>
        <a href="{{ url_for('theory') }}" class="nav-link{% if request.endpoint == 'theory' %} active{% endif %}">Theory</a>
        <a href="{{ url_for('simulator') }}" class="nav-link{% if request.endpoint == 'simulator' %} active{% endif %}">Simulator</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>MYP Personal Project — Physics of a Volleyball Serve</p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
